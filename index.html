<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<link rel="manifest" href="manifest.json">
<meta name="description" content="攒钱日记 · 定投理财数据看板">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="攒钱日记">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>攒钱日记 · 定投数据看板</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#f4f6fb;color:#1a1f36;-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px}
.page{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 16px;gap:10px}
.brand{font-size:19px;font-weight:700;letter-spacing:.3px}
.brand-sub{font-size:12px;color:#8b93a8;margin-top:2px}
.btn-ghost{border:none;background:#fff;color:#4f7cff;font-size:14px;font-weight:600;padding:9px 15px;border-radius:12px;box-shadow:0 2px 8px rgba(26,31,54,.06);font-family:inherit;cursor:pointer;flex-shrink:0}
.btn-ghost:active{opacity:.65}
.page-title{font-size:15px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{background:linear-gradient(135deg,#5b8cff 0%,#7b5cff 100%);border-radius:20px;padding:20px 20px 18px;color:#fff;box-shadow:0 12px 30px -8px rgba(91,140,255,.5);margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-56px;width:170px;height:170px;background:rgba(255,255,255,.1);border-radius:50%;pointer-events:none}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;margin-bottom:2px}
.hero-label{font-size:12.5px;opacity:.9;letter-spacing:.4px}
.days-badge{font-size:11.5px;background:rgba(255,255,255,.24);padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
.hero-value{font-size:33px;font-weight:700;margin:5px 0 14px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.15;position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-main{display:flex;align-items:center;gap:12px;margin:5px 0 14px;position:relative;z-index:1}
.hero-main .hero-value{margin:0;flex:1;min-width:0}
.goal-ring{width:72px;height:72px;flex-shrink:0;display:block}
.hero-metrics{display:flex;gap:8px;position:relative;z-index:1}
.hm{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:9px 10px;min-width:0}
.hm span{display:block;font-size:11px;opacity:.85;margin-bottom:3px}
.hm b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hm b.pos{color:#ffe28a}
.hm b.neg{color:#a8f0d4}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(26,31,54,.05)}
.card-title{font-size:14.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title .sub{font-size:12px;font-weight:400;color:#9aa1b5}
.card-title.collapsible{cursor:pointer;user-select:none;-webkit-user-select:none;margin-bottom:0}
.card-title.collapsible .lhs{display:flex;align-items:center;gap:6px}
.chevron{font-size:12px;color:#9aa1b5;transition:transform .2s;display:inline-block;line-height:1}
.chevron.open{transform:rotate(180deg)}
.card-title.collapsible + .collapse-body{margin-top:12px}
.chart-box{position:relative;width:100%}
.chart-box canvas{display:block;width:100%}
.chart-legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:#6b7391;flex-wrap:wrap}
.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{display:inline-block;width:10px;height:3px;border-radius:2px}
.legend{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.lg-item{display:flex;align-items:center;gap:8px;font-size:13px}
.lg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.lg-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#454b63}
.lg-val{font-variant-numeric:tabular-nums;color:#1a1f36;font-weight:500}
.lg-pct{width:50px;text-align:right;color:#9aa1b5;font-variant-numeric:tabular-nums;font-size:12.5px}
.acc-item{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #f1f3f9;cursor:pointer}
.acc-item:last-child{border-bottom:none;padding-bottom:2px}
.acc-item:active{opacity:.55}
.acc-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.acc-main{flex:1;min-width:0}
.acc-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-sub{font-size:12px;color:#9aa1b5;margin-top:3px;display:flex;gap:8px;align-items:center}
.acc-sub .days{color:#8b93a8;background:#f0f2f8;padding:1px 6px;border-radius:6px;font-size:11px}
.acc-right{text-align:right;flex-shrink:0}
.acc-amt{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.acc-rate{font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:600}
.up{color:#f0554f}
.down{color:#12b886}
.muted{color:#9aa1b5}
.empty{text-align:center;padding:34px 20px;color:#9aa1b5;font-size:13.5px;line-height:1.8}
.hold-item{padding:14px 0;border-bottom:1px solid #f1f3f9}
.hold-item:last-child{border-bottom:none;padding-bottom:2px}
.hold-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.hold-name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hold-profit{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.hold-bar{height:6px;border-radius:3px;background:#f0f2f8;overflow:hidden;margin-bottom:8px}
.hold-bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.hold-bottom{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:#9aa1b5;font-variant-numeric:tabular-nums}
.hold-bottom .up{color:#f0554f;font-weight:600}
.hold-bottom .down{color:#12b886;font-weight:600}
.note-item{padding:12px 0;border-bottom:1px solid #f1f3f9}
.note-item:last-child{border-bottom:none;padding-bottom:2px}
.note-date{font-size:11.5px;color:#9aa1b5;font-weight:600;margin-bottom:5px}
.note-content{font-size:13.5px;line-height:1.65;color:#454b63;white-space:pre-wrap;word-break:break-word}
.row{display:flex;align-items:center;gap:9px}
.inp{width:100%;border:1px solid #e4e8f2;border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;background:#fafbfe;color:#1a1f36;outline:none;transition:border-color .15s,background .15s}
.inp:focus{border-color:#4f7cff;background:#fff}
textarea.inp{resize:vertical;line-height:1.55}
.inp-name{font-weight:600;flex:1;min-width:0}
.btn-del{border:none;background:#fff0f0;color:#f0554f;font-size:12.5px;padding:9px 12px;border-radius:10px;font-family:inherit;cursor:pointer;flex-shrink:0;font-weight:500}
.btn-del:active{opacity:.6}
.seg{display:flex;background:#f0f2f8;border-radius:12px;padding:3px;margin:8px 0 4px;gap:3px}
.seg button{flex:1;border:none;background:transparent;color:#6b7391;font-size:13px;padding:8px 0;border-radius:10px;font-family:inherit;cursor:pointer;font-weight:500}
.seg button.on{background:#fff;color:#4f7cff;font-weight:600;box-shadow:0 1px 4px rgba(26,31,54,.1)}
.h-row{border:1px solid #eef1f7;border-radius:13px;padding:11px;margin-bottom:9px;background:#fbfcfe}
.h-row .row{margin-bottom:9px}
.h-row .row:last-child{margin-bottom:0}
.h-nums{display:flex;gap:9px}
.h-nums label{flex:1;font-size:11.5px;color:#8b93a8;min-width:0}
.h-nums .inp{margin-top:5px}
.btn-add{width:100%;border:1.5px dashed #cdd6ee;background:#f8fafe;color:#4f7cff;border-radius:12px;padding:12px;font-size:13.5px;font-family:inherit;cursor:pointer;font-weight:500;margin-top:4px}
.btn-add:active{opacity:.6}
.hint{font-size:12.5px;color:#9aa1b5;line-height:1.7;margin:0 0 12px}
.btn-line{flex:1;border:none;background:#f4f6fb;color:#4f7cff;font-size:13.5px;font-weight:600;padding:12px;border-radius:12px;font-family:inherit;cursor:pointer}
.btn-line:active{opacity:.6}
.btn-share{width:100%;border:none;background:linear-gradient(135deg,#5b8cff,#7b5cff);color:#fff;font-size:15px;font-weight:600;padding:15px;border-radius:16px;font-family:inherit;cursor:pointer;box-shadow:0 8px 22px -8px rgba(91,140,255,.7);margin-bottom:14px}
.btn-share:active{opacity:.8}
.btn-record{width:100%;border:none;background:#fff;color:#4f7cff;font-size:13.5px;font-weight:600;padding:12px;border-radius:14px;font-family:inherit;cursor:pointer;margin-bottom:14px;box-shadow:0 2px 12px rgba(26,31,54,.06);border:1px solid #e4e8f2}
.btn-record:active{opacity:.7}
.color-picker{display:flex;gap:9px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #e4e8f2;flex-shrink:0}
.color-dot.on{box-shadow:0 0 0 2px #4f7cff;transform:scale(1.1)}
.color-dot:active{opacity:.7}
.field-label{font-size:12px;color:#8b93a8;margin-bottom:5px;display:block}
.form-gap{margin-bottom:12px}
.modal{position:fixed;inset:0;display:none;z-index:100;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(15,20,40,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-body{position:relative;background:#fff;border-radius:20px;padding:16px;max-width:430px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-tip{font-size:12.5px;color:#8b93a8;text-align:center;margin-bottom:12px}
.modal-img-wrap{flex:1;overflow:auto;border-radius:12px;background:#f4f6fb;min-height:0;-webkit-overflow-scrolling:touch}
.modal-img-wrap img{width:100%;display:block;border-radius:12px}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.mbtn{flex:1;text-align:center;padding:13px;border-radius:13px;border:none;font-size:14px;font-family:inherit;font-weight:600;cursor:pointer;background:#f0f2f8;color:#454b63;text-decoration:none;display:block}
.mbtn.primary{background:#4f7cff;color:#fff}
.mbtn:active{opacity:.7}
</style>
</head>
<body>
<div id="app"></div>

<div class="modal" id="modal">
  <div class="modal-mask" data-act="close-modal"></div>
  <div class="modal-body">
    <div class="modal-tip">长按图片可保存到相册</div>
    <div class="modal-img-wrap"><img id="shareImg" alt="分享图"></div>
    <div class="modal-actions">
      <a id="dlBtn" class="mbtn primary" download="share.png">下载图片</a>
      <button class="mbtn" data-act="close-modal">关闭</button>
    </div>
  </div>
</div>

<script>
/* ============ 常量 & 工具 ============ */
const STORAGE_KEY = 'savings_diary_v1';
const PALETTE = ['#4f7cff','#f0554f','#12b886','#f7a942','#9b5de5','#00b8d9','#ff7ab6','#7a869a'];
const UP = '#f0554f';
const DOWN = '#12b886';
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

function uid(){ return Math.random().toString(36).slice(2,10); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){
  if(!isFinite(n)) n = 0;
  return Math.round(n).toLocaleString('zh-CN');
}
function fmtSigned(n){
  if(!isFinite(n)) n = 0;
  return (n > 0 ? '+' : '') + fmtMoney(n);
}
function fmtRate(r){
  if(!isFinite(r)) r = 0;
  return (r > 0 ? '+' : '') + r.toFixed(2) + '%';
}
function shortMoney(n){
  if(!isFinite(n)) n = 0;
  return Math.round(n).toLocaleString('zh-CN');
}
function shortSigned(n){ return (n > 0 ? '+' : '') + shortMoney(n); }
function formatDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function todayStr(){ return formatDate(new Date()); }
function calcDays(startDate){
  if(!startDate) return 0;
  const s = new Date(startDate + 'T00:00:00');
  if(isNaN(s.getTime())) return 0;
  const now = new Date();
  now.setHours(0,0,0,0);
  const diff = Math.floor((now - s) / 86400000) + 1;
  return diff >= 1 ? diff : 0;
}
function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, Math.abs(h)/2, Math.abs(w)/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function fitText(ctx, text, maxWidth){
  text = String(text == null ? '' : text);
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
  return t + '…';
}
/* 分享图标的聚合：超过 maxCount 时，前 maxCount-1 个 + “其他” */
function aggregateForShare(items, maxCount){
  if(!items || items.length <= maxCount) return items;
  const sorted = items.slice().sort((a, b) => b.value - a.value);
  const top = sorted.slice(0, maxCount - 1);
  const rest = sorted.slice(maxCount - 1);
  const restSum = rest.reduce((s, i) => s + i.value, 0);
  top.push({ label: '其他（' + rest.length + ' 项）', value: restSum, color: '#c7cdd9' });
  return top;
}

/* ============ 状态 ============ */
function newAccount(name){
  return {
    id: uid(), name: name || '新账户',
    color: PALETTE[state.accounts.length % PALETTE.length],
    mode: 'simple', startDate: todayStr(),
    principal: 0, assets: 0, targetAmount: 0,
    holdings: [], history: [], notes: []
  };
}

function seedState(){
  return {
    accounts: [
      {
        id: uid(), name: '养老定投账户', color: PALETTE[0], mode: 'detail',
        startDate: (() => { const d = new Date(); d.setDate(d.getDate() - 365); return formatDate(d); })(),
        principal: 0, assets: 0, targetAmount: 0,
        holdings: [
          { id: uid(), name: '创业板指数基金', principal: 24000, assets: 26400, color: PALETTE[0] },
          { id: uid(), name: '中证红利指数基金', principal: 36000, assets: 38520, color: PALETTE[1] }
        ],
        history: [],
        notes: []
      },
      {
        id: uid(), name: '稳健理财账户', color: PALETTE[2], mode: 'simple',
        startDate: (() => { const d = new Date(); d.setDate(d.getDate() - 120); return formatDate(d); })(),
        principal: 50000, assets: 52300, targetAmount: 0, holdings: [], history: [], notes: []
      }
    ]
  };
}

function normalizeState(s){
  if(!s || !Array.isArray(s.accounts)) return seedState();
  s.accounts.forEach(acc => {
    if(!Array.isArray(acc.holdings)) acc.holdings = [];
    if(!Array.isArray(acc.history)) acc.history = [];
    if(!Array.isArray(acc.notes)) acc.notes = [];
    if(typeof acc.startDate !== 'string') acc.startDate = '';
    if(!acc.color) acc.color = PALETTE[0];
    if(!acc.mode) acc.mode = 'simple';
    if(typeof acc.targetAmount !== 'number') acc.targetAmount = 0;
  });
  return s;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      return normalizeState(s);
    }
  }catch(e){}
  return seedState();
}

let saveTimer = null;
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function saveDebounced(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }

let state = loadState();
let view = { name: 'home' };
/* UI 折叠状态（不持久化） */
const uiState = { histOpen: {}, notesOpen: {} };

/* ============ 计算 ============ */
function calcAcc(acc){
  let p = 0, a = 0;
  if(acc.mode === 'detail'){
    (acc.holdings || []).forEach(h => { p += num(h.principal); a += num(h.assets); });
  } else {
    p = num(acc.principal);
    a = num(acc.assets);
  }
  const profit = a - p;
  return { principal: p, assets: a, profit, rate: p > 0 ? profit / p * 100 : 0 };
}

function calcAll(){
  let p = 0, a = 0;
  state.accounts.forEach(acc => { const s = calcAcc(acc); p += s.principal; a += s.assets; });
  const profit = a - p;
  return { principal: p, assets: a, profit, rate: p > 0 ? profit / p * 100 : 0 };
}

/* ============ 渲染 ============ */
function render(scrollTop){
  if(view.name === 'account' && !state.accounts.some(a => a.id === view.id)){
    view = { name: 'home' };
  }
  if(view.name === 'account-edit' && !state.accounts.some(a => a.id === view.id)){
    view = { name: 'home' };
  }
  const app = document.getElementById('app');
  let inner = '';
  if(view.name === 'home') inner = renderHome();
  else if(view.name === 'accounts-edit') inner = renderAccountsEdit();
  else if(view.name === 'account') inner = renderAccount(view.id);
  else if(view.name === 'account-edit') inner = renderAccountEdit(view.id);
  app.innerHTML = '<div class="page">' + inner + '</div>';
  if(scrollTop) window.scrollTo(0, 0);
  requestAnimationFrame(afterRender);
}

function legendHTML(items, total){
  return items.map(it => `
    <div class="lg-item">
      <span class="lg-dot" style="background:${it.color}"></span>
      <span class="lg-name">${esc(it.label)}</span>
      <span class="lg-val">${fmtMoney(it.value)}</span>
      <span class="lg-pct">${total > 0 ? ((it.value/total)*100).toFixed(1) : '0.0'}%</span>
    </div>`).join('');
}

/* ---------- 首页 ---------- */
function renderHome(){
  const g = calcAll();
  const list = state.accounts.map(acc => ({ acc, s: calcAcc(acc) }));
  const items = list
    .filter(x => x.s.assets > 0 || x.s.principal > 0)
    .map(x => ({ label: x.acc.name || '未命名账户', value: x.s.assets || x.s.principal, color: x.acc.color }));
  const total = items.reduce((s, i) => s + i.value, 0);
  const profitCls = g.profit > 0 ? 'pos' : (g.profit < 0 ? 'neg' : '');

  return `
    <div class="topbar">
      <div>
        <div class="brand">攒钱日记</div>
        <div class="brand-sub">定投理财数据看板</div>
      </div>
      <button class="btn-ghost" data-act="manage-accounts">编辑账户</button>
    </div>

    <div class="hero">
      <div class="hero-head">
        <div class="hero-label">总资产（元）</div>
      </div>
      <div class="hero-value">${fmtMoney(g.assets)}</div>
      <div class="hero-metrics">
        <div class="hm"><span>总本金</span><b>${shortMoney(g.principal)}</b></div>
        <div class="hm"><span>总收益</span><b class="${profitCls}">${shortSigned(g.profit)}</b></div>
        <div class="hm"><span>收益率</span><b class="${profitCls}">${fmtRate(g.rate)}</b></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">资产分布<span class="sub">${list.length} 个账户</span></div>
      ${items.length
        ? `<div class="chart-box"><canvas id="c-donut"></canvas></div>
           <div class="legend">${legendHTML(items, total)}</div>`
        : `<div class="empty">暂无数据<br>点击右上角「编辑账户」添加</div>`}
    </div>

    <div class="card">
      <div class="card-title">我的账户</div>
      ${list.length ? list.map(({acc, s}) => {
        const days = calcDays(acc.startDate);
        return `
        <div class="acc-item" data-act="open-acc" data-id="${acc.id}">
          <span class="acc-dot" style="background:${acc.color}"></span>
          <div class="acc-main">
            <div class="acc-name">${esc(acc.name || '未命名账户')}</div>
            <div class="acc-sub">

/* ============ 图表绘制 ============ */
function drawDonut(canvas, items, total){
  if(!canvas || !items.length || total <= 0) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth;
  const h = 200;
  canvas.style.height = h + 'px';
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const cx = w/2, cy = h/2;
  const R = Math.min(w, h) * 0.42;
  const r = R * 0.62;
  let a0 = -Math.PI/2;
  const gap = items.length > 1 ? 0.02 : 0;
  items.forEach(it => {
    const ang = (it.value/total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, a0 + gap/2, a0 + ang - gap/2);
    ctx.arc(cx, cy, r, a0 + ang - gap/2, a0 + gap/2, true);
    ctx.closePath();
    ctx.fillStyle = it.color;
    ctx.fill();
    a0 += ang;
  });
  ctx.fillStyle = '#1a1f36';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 18px ' + FONT;
  ctx.fillText(shortMoney(total), cx, cy - 6);
  ctx.fillStyle = '#9aa1b5';
  ctx.font = '12px ' + FONT;
  ctx.fillText('总市值', cx, cy + 16);
}

function drawBars(canvas, items){
  if(!canvas || !items.length) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth;
  const rowH = 34;
  const h = items.length * rowH + 20;
  canvas.style.height = h + 'px';
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const labelW = 110;
  const valW = 62;
  const chartX = labelW + 8;
  const chartW = Math.max(20, w - labelW - valW - 16);
  const midX = chartX + chartW/2;
  const maxAbs = Math.max(...items.map(i => Math.abs(i.rate)), 1);

  ctx.strokeStyle = '#eef1f7';
  ctx.beginPath();
  ctx.moveTo(midX, 8);
  ctx.lineTo(midX, h - 6);
  ctx.stroke();

  items.forEach((it, idx) => {
    const y = 10 + idx * rowH + rowH/2;
    ctx.fillStyle = '#454b63';
    ctx.font = '12.5px ' + FONT;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(fitText(ctx, it.label, labelW - 4), 0, y);

    const barH = 14;
    const halfW = (Math.abs(it.rate) / maxAbs) * (chartW/2 - 4);
    const positive = it.rate >= 0;
    const color = positive ? UP : DOWN;
    const bx = positive ? midX : midX - halfW;
    ctx.fillStyle = color;
    roundRect(ctx, bx, y - barH/2, Math.max(2, halfW), barH, 4);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.font = '600 12px ' + FONT;
    ctx.textAlign = 'right';
    ctx.fillText(fmtRate(it.rate), w - 4, y);
  });
}
function drawGoalRing(canvas, current, target){
  if(!canvas || !target || target <= 0) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = 72;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);

  const cx = size / 2, cy = size / 2;
  const R = size / 2 - 4;
  const lw = 7;
  const realPct = current / target * 100;
  const drawn = Math.min(Math.max(realPct, 0) / 100, 1); // 环最多画满，不超出
  const done = realPct >= 100;

  // 底环
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = lw;
  ctx.stroke();

  // 进度环
  if(drawn > 0){
    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * drawn);
    ctx.strokeStyle = done ? '#4ff0d4' : '#FFFF36';
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // 中心百分比
  const txt = (realPct >= 1000 ? '999+' : Math.round(realPct)) + '%';
  ctx.fillStyle = done ? '#4ff0d4' : '#FFFF36';
  ctx.font = '700 14px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, cx, cy);
}

/* 走势图：本金/市值（左轴）+ 收益率（右轴），平滑无点 */
function drawHistoryChart(canvas, history){
  if(!canvas || !history || history.length < 2) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth;
  const h = 240;
  canvas.style.height = h + 'px';
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const padL = 50, padR = 42, padT = 18, padB = 28;
  const cw = Math.max(20, w - padL - padR);
  const ch = Math.max(20, h - padT - padB);

  const sorted = history.slice().sort((a,b) => a.date.localeCompare(b.date));
  const points = sorted.map(hh => {
    const p = num(hh.principal);
    const a = num(hh.assets);
    return { date: hh.date, principal: p, assets: a, rate: p > 0 ? (a - p) / p * 100 : 0 };
  });
  const n = points.length;
  const tMin = new Date(points[0].date + 'T00:00:00').getTime();
  const tMax = new Date(points[n-1].date + 'T00:00:00').getTime();
  const tSpan = tMax - tMin;
  points.forEach((pt, i) => {
    if (tSpan <= 0) {
      pt.x = padL + (i / (n - 1)) * cw;
    } else {
      const t = new Date(pt.date + 'T00:00:00').getTime();
      pt.x = padL + ((t - tMin) / tSpan) * cw;
    }
  });

  const leftVals = [];
  points.forEach(p => { leftVals.push(p.principal, p.assets); });
  let minL = Math.min(...leftVals);
  let maxL = Math.max(...leftVals);
  if(maxL === minL){
    // 所有值相同时：最小值保持不动，上侧加一点空间
    maxL = minL + (Math.abs(minL) * 0.1 || 1);
  }
  const spanL = maxL - minL || 1;
  // 左侧金额轴：最小值即数据最小值，不再向下扩展（避免出现负数刻度）；仅向上留白
  maxL += spanL * 0.06;

  const rightVals = points.map(p => p.rate);
  let minR = Math.min(...rightVals, 0);
  let maxR = Math.max(...rightVals, 0);
  if(maxR === minR){ maxR = minR + 1; }
  const spanR = maxR - minR || 1;
  minR -= spanR * 0.18;
  maxR += spanR * 0.18;

  const yL = v => padT + (1 - (v - minL) / (maxL - minL)) * ch;
  const yR = v => padT + (1 - (v - minR) / (maxR - minR)) * ch;

  ctx.strokeStyle = '#eef1f7';
  ctx.lineWidth = 1;
 [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const y = padT + t * ch;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
  });

  ctx.fillStyle = '#9aa1b5';
  ctx.font = '10px ' + FONT;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const val = maxL - t * (maxL - minL);
    ctx.fillText(shortMoney(val), padL - 6, padT + t * ch);
  });

  ctx.textAlign = 'left';
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const val = maxR - t * (maxR - minR);
    ctx.fillText(val.toFixed(1) + '%', w - padR + 6, padT + t * ch);
  });

  function drawSmooth(getY, strokeColor, fillColor){
    const pts = points.map(p => ({ x: p.x, y: getY(p) }));
    const tension = 0.25;                 // 0~1，越小越平直；觉得过冲就调到 0.35
    const getCP = i => {
      if(i < 0) return pts[0];
      if(i >= pts.length) return pts[pts.length - 1];
      return pts[i];
    };
    function buildPath(){
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i = 0; i < pts.length - 1; i++){
        const p0 = getCP(i - 1), p1 = pts[i], p2 = pts[i + 1], p3 = getCP(i + 2);
        const cp1x = p1.x + (p2.x - p0.x) / 6 * tension * 2;
        const cp1y = p1.y + (p2.y - p0.y) / 6 * tension * 2;
        const cp2x = p2.x - (p3.x - p1.x) / 6 * tension * 2;
        const cp2y = p2.y - (p3.y - p1.y) / 6 * tension * 2;
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      }
    }
    if(fillColor){
      ctx.save();
      ctx.beginPath();
      ctx.rect(padL, padT, cw, ch);
      ctx.clip();
      ctx.beginPath();
      buildPath();
      ctx.lineTo(pts[pts.length-1].x, padT + ch);
      ctx.lineTo(pts[0].x, padT + ch);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, padT, 0, padT + ch);
      grad.addColorStop(0, fillColor);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    buildPath();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  drawSmooth(p => yL(p.principal), '#4f7cff', 'rgba(79,124,255,0.18)');
  drawSmooth(p => yL(p.assets), '#7b5cff', 'rgba(123,92,255,0.18)');
  drawSmooth(p => yR(p.rate), '#f7a942', null);

  const midDate = formatDate(new Date(tMin + tSpan / 2)).slice(5);
  const datePositions = [
    { x: padL, text: points[0].date.slice(5), align: 'left' },
    { x: padL + cw / 2, text: midDate, align: 'center' },
    { x: padL + cw, text: points[n-1].date.slice(5), align: 'right' }
  ];
  ctx.fillStyle = '#9aa1b5';
  ctx.font = '10px ' + FONT;
  ctx.textBaseline = 'top';
  datePointsDedup(datePositions).forEach(dp => {
    ctx.textAlign = dp.align;
    ctx.fillText(dp.text, dp.x, padT + ch + 8);
  });
}

function datePointsDedup(arr, minGap){
  minGap = minGap || 30;
  if(arr.length <= 1) return arr;
  const out = [arr[0]];
  for(let i = 1; i < arr.length; i++){
    if(arr[i].x - out[out.length-1].x > minGap) out.push(arr[i]);
  }
  if(out[out.length-1] !== arr[arr.length-1]) out[out.length-1] = arr[arr.length-1];
  return out;
}

function afterRender(){
  if(view.name === 'home'){
    const cv = document.getElementById('c-donut');
    if(cv){
      const items = state.accounts.map(acc => ({ s: calcAcc(acc), acc }))
        .filter(x => x.s.assets > 0 || x.s.principal > 0)
        .map(x => ({ label: x.acc.name, value: x.s.assets || x.s.principal, color: x.acc.color }));
      const total = items.reduce((s, i) => s + i.value, 0);
      drawDonut(cv, items, total);
    }
  } else if(view.name === 'account'){
    const acc = state.accounts.find(a => a.id === view.id);
    if(!acc) return;
    const cvGoal = document.getElementById('c-goal');
    if(cvGoal) drawGoalRing(cvGoal, calcAcc(acc).assets, acc.targetAmount);
    const cvH = document.getElementById('c-history');
    if(cvH){
      const hist = (acc.history || []).slice().sort((a,b) => a.date.localeCompare(b.date));
      drawHistoryChart(cvH, hist);
    }
    if(acc.mode === 'detail'){
      const items = (acc.holdings || []).map(h => {
        const p = num(h.principal), a = num(h.assets);
        return { label: h.name || '未命名', value: a || p, principal: p, assets: a,
          rate: p > 0 ? (a - p) / p * 100 : 0, color: h.color };
      });
      const shown = items.filter(x => x.value > 0);
      const total = shown.reduce((s, i) => s + i.value, 0);
      const cv1 = document.getElementById('c-donut');
      if(cv1) drawDonut(cv1, shown, total);
      const cv2 = document.getElementById('c-bars');
      if(cv2) drawBars(cv2, items);
    }
  }
}

/* ============ 事件 ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  if(act === 'go-home'){ view = { name: 'home' }; render(true); }
  else if(act === 'manage-accounts'){ view = { name: 'accounts-edit' }; render(true); }
  else if(act === 'open-acc'){ view = { name: 'account', id }; render(true); }
  else if(act === 'edit-acc'){ view = { name: 'account-edit', id }; render(true); }
  else if(act === 'back-from-edit'){
    if(view.name === 'account-edit'){
      view = { name: 'account', id: view.id };
    } else {
      view = { name: 'home' };
    }
    render(true);
  }
  else if(act === 'close-modal'){ document.getElementById('modal').classList.remove('show'); }
  else if(act === 'share-all'){ shareAll(); }
  else if(act === 'share-acc'){ shareAcc(id); }

  else if(act === 'add-acc'){
    state.accounts.push(newAccount('新账户'));
    save(); render();
  }
  else if(act === 'del-acc'){
    const acc = state.accounts.find(a => a.id === id);
    if(acc && confirm('确定删除「' + acc.name + '」吗？该账户的所有数据将被删除。')){
      state.accounts = state.accounts.filter(a => a.id !== id);
      save(); render();
    }
  }
  else if(act === 'set-color'){
    const acc = state.accounts.find(a => a.id === el.dataset.accId);
    if(acc){ acc.color = el.dataset.color; save(); render(); }
  }

  else if(act === 'mode-detail' || act === 'mode-simple'){
    const acc = state.accounts.find(a => a.id === id);
    if(!acc) return;
    const to = act === 'mode-detail' ? 'detail' : 'simple';
    if(acc.mode === to) return;
    if(to === 'simple'){
      if(acc.holdings && acc.holdings.length){
        const s = calcAcc(acc);
        if(!confirm('切换为「整体录入」会丢掉各标的的明细（但会把当前总额搬过去）。继续？')) return;
        acc.principal = s.principal;
        acc.assets = s.assets;
        acc.holdings = [];
      }
      acc.mode = 'simple';
    } else {
      acc.mode = 'detail';
      acc.holdings = acc.holdings || [];
    }
    save(); render();
  }
  else if(act === 'add-hold'){
    const acc = state.accounts.find(a => a.id === id);
    if(!acc) return;
    const idx = (acc.holdings || []).length;
    acc.holdings.push({
      id: uid(), name: '新标的', principal: 0, assets: 0,
      color: PALETTE[idx % PALETTE.length]
    });
    save(); render();
  }
  else if(act === 'del-hold'){
    const acc = state.accounts.find(a => a.id === el.dataset.accId);
    if(!acc) return;
    acc.holdings = (acc.holdings || []).filter(h => h.id !== el.dataset.hId);
    save(); render();
  }

  /* 历史折叠/展开 */
  else if(act === 'toggle-hist'){
    const acc = state.accounts.find(a => a.id === id);
    if(!acc) return;
    const cur = uiState.histOpen[id] !== undefined
      ? uiState.histOpen[id]
      : ((acc.history || []).length === 0);
    uiState.histOpen[id] = !cur;
    render();
  }
  else if(act === 'toggle-notes'){
    const acc = state.accounts.find(a => a.id === id);
    if(!acc) return;
    const cur = uiState.notesOpen[id] !== undefined
      ? uiState.notesOpen[id]
      : ((acc.notes || []).length === 0);
    uiState.notesOpen[id] = !cur;
    render();
  }

  /* 历史 */
  else if(act === 'add-hist'){
    const acc = state.accounts.find(a => a.id === id);
    if(!acc) return;
    acc.history = acc.history || [];
    const last = acc.history.slice().sort((a,b) => a.date.localeCompare(b.date)).pop();
    const s = calcAcc(acc);
    acc.history.push({
      id: uid(), date: todayStr(),
      principal: last ? last.principal : s.principal,
      assets: last ? last.assets : s.assets
    });
    uiState.histOpen[id] = true;
    save(); render();
  }
  else if(act === 'del-hist'){
    const acc = state.accounts.find(a => a.id === el.dataset.accId);
    if(!acc) return;
    acc.history = (acc.history || []).filter(h => h.id !== el.dataset.hId);
    save(); render();
  }
  else if(act === 'record-today'){
    const acc = state.accounts.find(a => a.id === id);
    if(!acc) return;
    const s = calcAcc(acc);
    const today = todayStr();
    acc.history = acc.history || [];
    const existing = acc.history.find(h => h.date === today);
    if(existing){
      existing.principal = s.principal;
      existing.assets = s.assets;
    } else {
      acc.history.push({ id: uid(), date: today, principal: s.principal, assets: s.assets });
    }
    uiState.histOpen[id] = true;
    save();
    showToast('已记录今日数据');
    render();
  }

  /* 备注 */
  else if(act === 'add-note'){
    const acc = state.accounts.find(a => a.id === id);
    if(!acc) return;
    acc.notes = acc.notes || [];
    acc.notes.push({ id: uid(), date: todayStr(), content: '' });
    uiState.notesOpen[id] = true;
    save(); render();
  }
  else if(act === 'del-note'){
    const acc = state.accounts.find(a => a.id === el.dataset.accId);
    if(!acc) return;
    acc.notes = (acc.notes || []).filter(n => n.id !== el.dataset.nid);
    save(); render();
  }

  /* 数据管理 */
  else if(act === 'export-json'){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'savings-diary-' + todayStr() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  else if(act === 'import-json'){
    document.getElementById('importFile').click();
  }
  else if(act === 'reset-all'){
    if(confirm('确定清空所有数据吗？此操作不可恢复！')){
      localStorage.removeItem(STORAGE_KEY);
      state = seedState();
      uiState.histOpen = {};
      uiState.notesOpen = {};
      save(); render(true);
    }
  }
});

  }

    if(h) h.date = el.value;

  else if(field === 'hist-principal'){
    const h = (acc.history || []).find(x => x.id === hId);

  else if(field === 'hist-assets'){

// 导入文件
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id !== 'importFile' || !el.files || !el.files[0]) return;
  const file = el.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const s = JSON.parse(reader.result);
      if(!s || !Array.isArray(s.accounts)) throw new Error('bad');
      state = normalizeState(s);
      save(); render(true);
      alert('导入成功！');
    }catch(err){
      alert('导入失败：文件格式不正确');
    }
    el.value = '';
  };
  reader.readAsText(file);
});

function shareAll(){
  const g = calcAll();
  const list = state.accounts.map(acc => ({ acc, s: calcAcc(acc) }))
    .filter(x => x.s.assets > 0 || x.s.principal > 0);
  let items = list.map(x => ({
    label: x.acc.name || '未命名账户',
    value: x.s.assets || x.s.principal,
    color: x.acc.color
  }));
  items = aggregateForShare(items, 6);
  const total = items.reduce((s, i) => s + i.value, 0);
  if(!items.length){ alert('还没有数据，先去编辑吧'); return; }
  const img = buildShareImage({
    title: '攒钱日记 · 总览',
    subtitle: todayStr(),
    days: 0,
    main: { label: '总资产（元）', value: g.assets, principal: g.principal, profit: g.profit, rate: g.rate, target: 0 },
    donutTitle: '账户资产分布',
    donutItems: items,
    donutTotal: total,
    history: [],

  });

function shareAcc(id){
  const acc = state.accounts.find(a => a.id === id);
  if(!acc) return;
  const s = calcAcc(acc);
  const days = calcDays(acc.startDate);
  const hist = (acc.history || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const hasChart = hist.length >= 2;

  let items = [], bars = [];
  if(acc.mode === 'detail'){
    items = (acc.holdings || []).map(h => {
      const p = num(h.principal), a = num(h.assets);
      return { label: h.name || '未命名', value: a || p, color: h.color,
        rate: p > 0 ? (a - p) / p * 100 : 0 };
    }).filter(x => x.value > 0);
    items = aggregateForShare(items, 6);
    bars = (acc.holdings || []).map(h => {
      const p = num(h.principal), a = num(h.assets);
      return { label: h.name || '未命名', rate: p > 0 ? (a - p) / p * 100 : 0 };
    });
  }
  const total = items.reduce((s, i) => s + i.value, 0);

  const img = buildShareImage({
    title: acc.name || '账户详情',
    subtitle: todayStr(),
    days,
    main: { label: '资产（元）', value: s.assets, principal: s.principal, profit: s.profit, rate: s.rate, target: acc.targetAmount || 0 },
    donutTitle: acc.mode === 'detail' ? '标的占比' : '',
    donutItems: items,
    donutTotal: total,
    history: hasChart ? hist : [],
    bars: acc.mode === 'detail' ? bars : []
  });
  showModal(img);
}

function buildShareImage(d){
  const W = 1080;
  const pad = 60;
  const innerW = W - pad * 2;

  const headerH = 200;
  const mainCardH = 460;
  const historyH = (d.history && d.history.length >= 2) ? 560 : 0;
  /* 环形图卡片高度：≤3 个标的时更紧凑；4–6 个（聚合后）时加高 */
  const donutItemCount = d.donutItems ? d.donutItems.length : 0;
  const donutH = donutItemCount > 0 ? (donutItemCount <= 3 ? 560 : 620) : 0;
  const barsH = (d.bars && d.bars.length) ? (d.bars.length * 100 + 150) : 0;
  const footerH = 100;
  const gap = 32;

  let H = pad + headerH + gap + mainCardH + gap;
  if(historyH){ H += historyH + gap; }
  if(donutH){ H += donutH + gap; }
  if(barsH){ H += barsH + gap; }
  H += footerH + pad;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#f4f6fb');
  bgGrad.addColorStop(1, '#eaf0ff');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  let y = pad;
  ctx.fillStyle = '#1a1f36';
  ctx.font = '700 60px ' + FONT;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText(fitText(ctx, d.title, innerW - 280), pad, y);
  ctx.fillStyle = '#9aa1b5';
  ctx.font = '26px ' + FONT;
  ctx.fillText(d.subtitle, pad, y + 86);
  if(d.days > 0){
  ctx.font = '600 30px ' + FONT;
  const txt = '实盘第 ' + d.days + ' 天';
  const tw = ctx.measureText(txt).width + 44;
  const bx = pad + innerW - tw;
  const by = y + 4;
  ctx.fillStyle = '#e4ecff';
  roundRect(ctx, bx, by, tw, 54, 27);
  ctx.fill();
  ctx.fillStyle = '#4f7cff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx + tw/2, by + 27);
  }
  y += headerH;

  drawShareMainCard(ctx, pad, y, innerW, mainCardH, d.main);
  y += mainCardH + gap;

  if(historyH){
    drawShareHistory(ctx, pad, y, innerW, historyH, d.history);
    y += historyH + gap;
  }

  if(donutH){
    drawShareDonut(ctx, pad, y, innerW, donutH, d.donutTitle, d.donutItems, d.donutTotal);
    y += donutH + gap;
  }

  if(barsH){
    drawShareBars(ctx, pad, y, innerW, barsH, '收益率对比', d.bars);
    y += barsH + gap;
  }

  ctx.fillStyle = '#9aa1b5';
  ctx.font = '26px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('· 攒钱日记 · 定投数据看板 ·', W/2, y + 40);

  return canvas.toDataURL('image/png');
}

function drawShareMainCard(ctx, x, y, w, h, m){
  const grad = ctx.createLinearGradient(x, y, x + w, y + h);
  grad.addColorStop(0, '#5b8cff');
  grad.addColorStop(1, '#7b5cff');
  ctx.fillStyle = grad;
  roundRect(ctx, x, y, w, h, 40);
  ctx.fill();

  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x + w - 60, y + 40, 200, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const px = x + 48;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = '34px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(m.label, px, y + 56);

  const hasTarget = m.target && m.target > 0;
  ctx.fillStyle = '#fff';
  ctx.font = '700 84px ' + FONT;
  ctx.fillText(fitText(ctx, fmtMoney(m.value), hasTarget ? w - 340 : w - 96), px, y + 110);

  if(hasTarget){
    drawShareGoalRing(ctx, x + w - 160, y + 140, 90, 20, m.value, m.target);
  }

  const boxY = y + 280;
  const boxH = 130;
  const boxW = (w - 48*2 - 16*2) / 3;
  const labels = ['本金', '收益', '收益率'];
  const vals = [shortMoney(m.principal), shortSigned(m.profit), fmtRate(m.rate)];
  labels.forEach((lb, i) => {
    const bx = px + i * (boxW + 16);
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    roundRect(ctx, bx, boxY, boxW, boxH, 24);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.font = '30px ' + FONT;
    ctx.textBaseline = 'top';
    ctx.fillText(lb, bx + 24, boxY + 22);
    const color = i === 0 ? '#fff' : (m.profit > 0 ? '#ffe28a' : (m.profit < 0 ? '#a8f0d4' : '#fff'));
    ctx.fillStyle = color;
    ctx.font = '700 38px ' + FONT;
    ctx.fillText(fitText(ctx, vals[i], boxW - 48), bx + 24, boxY + 70);
  });
}
function drawShareGoalRing(ctx, cx, cy, R, lw, current, target){
  if(!target || target <= 0) return;
  const realPct = current / target * 100;
  const drawn = Math.min(Math.max(realPct, 0) / 100, 1);
  const done = realPct >= 100;

  // 底环
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = lw;
  ctx.stroke();

  // 进度环
  if(drawn > 0){
    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * drawn);
    ctx.strokeStyle = done ? '#4ff0d4' : '#FFFF36';
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // 中心百分比
  const pctTxt = (realPct >= 1000 ? '999+' : Math.round(realPct)) + '%';
  ctx.fillStyle = done ? '#4ff0d4' : '#FFFF36';
  ctx.font = '700 48px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(pctTxt, cx, cy - 14);

  // 小标签
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.font = '26px ' + FONT;
  ctx.fillText('目标达成', cx, cy + 34);

  // 恢复绘制状态，避免影响后面三个小格子
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
}

function drawShareHistory(ctx, x, y, w, h, history){
  ctx.fillStyle = '#fff';
  roundRect(ctx, x, y, w, h, 32);
  ctx.fill();

  ctx.fillStyle = '#1a1f36';
  ctx.font = '600 38px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('数据走势', x + 40, y + 32);

  ctx.font = '26px ' + FONT;
  const legendItems = [
    { c: '#4f7cff', t: '本金' },
    { c: '#7b5cff', t: '市值' },
    { c: '#f7a942', t: '收益率' }
  ];
  ctx.font = '600 38px ' + FONT;
  const titleW = ctx.measureText('数据走势').width;
  ctx.font = '26px ' + FONT;
  let lx = x + 40 + titleW + 150;
  legendItems.forEach(li => {
    ctx.fillStyle = li.c;
    roundRect(ctx, lx, y + 44, 24, 5, 3);
    ctx.fill();
    ctx.fillStyle = '#6b7391';
    ctx.fillText(li.t, lx + 34, y + 34);
    lx += ctx.measureText(li.t).width + 84;
  });

  const padL = 130, padR = 120, padT = 120, padB = 60;
  const cx = x + padL;
  const cy = y + padT;
  const cw = w - padL - padR;
  const ch = h - padT - padB;

  const sorted = history.slice().sort((a,b) => a.date.localeCompare(b.date));
  const points = sorted.map(hh => {
    const p = num(hh.principal);
    const a = num(hh.assets);
    return { date: hh.date, principal: p, assets: a, rate: p > 0 ? (a - p) / p * 100 : 0 };
  });
  const n = points.length;
  const tMin = new Date(points[0].date + 'T00:00:00').getTime();
  const tMax = new Date(points[n-1].date + 'T00:00:00').getTime();
  const tSpan = tMax - tMin;
  points.forEach((pt, i) => {
    if (tSpan <= 0) {
      pt.x = cx + (i / (n - 1)) * cw;
    } else {
      const t = new Date(pt.date + 'T00:00:00').getTime();
      pt.x = cx + ((t - tMin) / tSpan) * cw;
    }
  });

  const leftVals = [];
  points.forEach(p => { leftVals.push(p.principal, p.assets); });
  let minL = Math.min(...leftVals);
  let maxL = Math.max(...leftVals);
  if(maxL === minL){
    maxL = minL + (Math.abs(minL) * 0.1 || 1);
  }
  const spanL = maxL - minL || 1;
  maxL += spanL * 0.06;

  const rightVals = points.map(p => p.rate);
  let minR = Math.min(...rightVals, 0);
  let maxR = Math.max(...rightVals, 0);
  if(maxR === minR){ maxR = minR + 1; }
  const spanR = maxR - minR || 1;
  minR -= spanR * 0.18;
  maxR += spanR * 0.18;

  const yL = v => cy + (1 - (v - minL) / (maxL - minL)) * ch;
  const yR = v => cy + (1 - (v - minR) / (maxR - minR)) * ch;

  ctx.strokeStyle = '#eef1f7';
  ctx.lineWidth = 1.5;
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const gy = cy + t * ch;
    ctx.beginPath();
    ctx.moveTo(cx, gy);
    ctx.lineTo(cx + cw, gy);
    ctx.stroke();
  });

  ctx.fillStyle = '#9aa1b5';
  ctx.font = '24px ' + FONT;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const val = maxL - t * (maxL - minL);
    ctx.fillText(shortMoney(val), cx - 14, cy + t * ch);
  });
  ctx.textAlign = 'left';
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const val = maxR - t * (maxR - minR);
    ctx.fillText(val.toFixed(1) + '%', cx + cw + 14, cy + t * ch);
  });

  function drawSmooth(getY, strokeColor, fillColor){
    const pts = points.map(p => ({ x: p.x, y: getY(p) }));
    const tension = 0.35;
    const getCP = i => {
      if(i < 0) return pts[0];
      if(i >= pts.length) return pts[pts.length - 1];
      return pts[i];
    };
    function buildPath(){
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i = 0; i < pts.length - 1; i++){
        const p0 = getCP(i - 1), p1 = pts[i], p2 = pts[i + 1], p3 = getCP(i + 2);
        const cp1x = p1.x + (p2.x - p0.x) / 6 * tension * 2;
        const cp1y = p1.y + (p2.y - p0.y) / 6 * tension * 2;
        const cp2x = p2.x - (p3.x - p1.x) / 6 * tension * 2;
        const cp2y = p2.y - (p3.y - p1.y) / 6 * tension * 2;
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      }
    }
    if(fillColor){
      ctx.save();
      ctx.beginPath();
      ctx.rect(cx, cy, cw, ch);
      ctx.clip();
      ctx.beginPath();
      buildPath();
      ctx.lineTo(pts[pts.length-1].x, cy + ch);
      ctx.lineTo(pts[0].x, cy + ch);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, cy, 0, cy + ch);
      grad.addColorStop(0, fillColor);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    buildPath();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  drawSmooth(p => yL(p.principal), '#4f7cff', 'rgba(79,124,255,0.18)');
  drawSmooth(p => yL(p.assets), '#7b5cff', 'rgba(123,92,255,0.18)');
  drawSmooth(p => yR(p.rate), '#f7a942', null);

  const midDate = formatDate(new Date(tMin + tSpan / 2)).slice(5);
  const arr = [
    { x: cx, text: points[0].date.slice(5), align: 'left' },
    { x: cx + cw / 2, text: midDate, align: 'center' },
    { x: cx + cw, text: points[n-1].date.slice(5), align: 'right' }
  ];
  const dedup = datePointsDedup(arr, 90);
  ctx.fillStyle = '#9aa1b5';
  ctx.font = '24px ' + FONT;
  ctx.textBaseline = 'top';
  dedup.forEach(dp => {
    ctx.textAlign = dp.align;
    ctx.fillText(dp.text, dp.x, cy + ch + 16);
  });
}

function drawShareDonut(ctx, x, y, w, h, title, items, total){
  ctx.fillStyle = '#fff';
  roundRect(ctx, x, y, w, h, 32);
  ctx.fill();

  ctx.fillStyle = '#1a1f36';
  ctx.font = '600 38px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(title, x + 40, y + 32);

  /* 环形图固定位置；图例位置基于卡片高度 + 行数动态计算 */
  const cx = x + w/2;
  const cy = y + 300;
  const R = 140;
  const r = 88;
  let a0 = -Math.PI/2;
  const gap = items.length > 1 ? 0.025 : 0;
  items.forEach(it => {
    const ang = (it.value / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, a0 + gap/2, a0 + ang - gap/2);
    ctx.arc(cx, cy, r, a0 + ang - gap/2, a0 + gap/2, true);
    ctx.closePath();
    ctx.fillStyle = it.color;
    ctx.fill();
    a0 += ang;
  });
  ctx.fillStyle = '#1a1f36';
  ctx.font = '700 36px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(shortMoney(total), cx, cy - 14);
  ctx.fillStyle = '#9aa1b5';
  ctx.font = '28px ' + FONT;
  ctx.fillText('总市值', cx, cy + 32);

  /* 图例：从底部反推，保证永远不压环形图 */
  const rows = Math.ceil(items.length / 3);
  const rowH = 56;
  const legendH = rows * rowH;
  const lgY = y + h - 20 - legendH;
  const cols = Math.min(items.length, 3);
  const colW = (w - 80) / cols;
  const pctW = 110;                                   // 百分比预留宽度
  items.forEach((it, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const lx = x + 40 + col * colW;
    const ly = lgY + row * rowH;
    ctx.fillStyle = it.color;
    ctx.beginPath();
    ctx.arc(lx + 10, ly + 14, 9, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#454b63';
    ctx.font = '28px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const pct = total > 0 ? ((it.value/total)*100).toFixed(1) + '%' : '0%';
    const nameMaxW = colW - 40 - pctW - 20;          // 名字可用宽度
    ctx.fillText(fitText(ctx, it.label, nameMaxW), lx + 30, ly + 14);
    ctx.fillStyle = '#9aa1b5';
    ctx.textAlign = 'right';
    ctx.fillText(pct, lx + colW - 20, ly + 14);
  });
}

function drawShareBars(ctx, x, y, w, h, title, items){
  ctx.fillStyle = '#fff';
  roundRect(ctx, x, y, w, h, 32);
  ctx.fill();

  ctx.fillStyle = '#1a1f36';
  ctx.font = '600 38px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(title, x + 40, y + 32);

  const labelW = 300;
  const valW = 160;
  const chartX = x + 40 + labelW;
  const chartW = w - 40*2 - labelW - valW;
  const midX = chartX + chartW/2;
  const maxAbs = Math.max(...items.map(i => Math.abs(i.rate)), 1);
  const startY = y + 100;
  const rowH = 90;

  ctx.strokeStyle = '#eef1f7';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(midX, startY + 10);
  ctx.lineTo(midX, startY + items.length * rowH - 10);
  ctx.stroke();

  items.forEach((it, idx) => {
    const cy = startY + idx * rowH + rowH/2;
    ctx.fillStyle = '#454b63';
    ctx.font = '26px ' + FONT;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(fitText(ctx, it.label, labelW - 20), x + 40, cy);

    const barH = 36;
    const halfW = (Math.abs(it.rate) / maxAbs) * (chartW/2 - 10);
    const positive = it.rate >= 0;
    const color = positive ? UP : DOWN;
    const bx = positive ? midX : midX - halfW;
    ctx.fillStyle = color;
    roundRect(ctx, bx, cy - barH/2, Math.max(6, halfW), barH, 10);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.font = '600 26px ' + FONT;
    ctx.textAlign = 'right';
    ctx.fillText(fmtRate(it.rate), x + w - 40, cy);
  });
}

  const modal = document.getElementById('modal');
  document.getElementById('shareImg').src = dataUrl;
  const dl = document.getElementById('dlBtn');
  dl.href = dataUrl;
  dl.download = 'share-' + Date.now() + '.png';
  modal.classList.add('show');
}

/* 1) iOS 用 canvas 动态生成 PNG 图标（iOS 不认 SVG 的 apple-touch-icon） */
(function(){
  try{
    var c = document.createElement('canvas');
    c.width = c.height = 180;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#5b8cff'); g.addColorStop(1, '#7b5cff');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#fff'; x.lineWidth = 10; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath();
    x.moveTo(38, 124); x.lineTo(78, 92); x.lineTo(108, 106); x.lineTo(142, 58);
    x.stroke();
    x.fillStyle = '#fff';
    x.beginPath(); x.arc(142, 58, 13, 0, Math.PI * 2); x.fill();
    var link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  }catch(e){}
})();

/* 2) 注册 Service Worker + 自动更新 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').then(function(reg){
      // 回到前台时检查更新
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') reg.update().catch(function(){});
      });
      // 只有“已有 controller”（即不是首次安装）时才自动刷新，避免首次打开就闪一下
      if (navigator.serviceWorker.controller) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    }).catch(function(){});
  });
}
